# The advanced-randomisation two-Cookie fine-tune, read at its 10,000-step checkpoint.
#
# See `pi05_a3_two_cookie_adv_5k.yaml` for what the three checkpoints are for and which
# file documents each field.  This one is the comparison that matters: the control run's
# training loss is flat from about 10-12k, so if the task metric also stops moving between
# 10k and 15k here while the control *never* moved at all, then the plateau was a property
# of the data rather than of the step count.
#
#   a3-sim policy check configs/policies/pi05_a3_two_cookie_adv_10k.yaml

name: pi05-a3-two-cookie-adv-10k
notes: >
  The advanced-randomisation fine-tune at step 10,000 of 15,000.  Same recipe as the
  control arm, trained on layouts that actually vary; the middle point of a convergence
  curve whose purpose is to separate "needs more steps" from "needed better data".

transport:
  kind: subprocess
  runtime:
    kind: local
  cwd: /root/autodl-tmp/a3-collect
  command:
    - .venv/bin/python
    - /root/a3_dual_arm_sim/scripts/a3_bridge_server.py
    - --adapter
    - adapters/pi05_a3.py
    - --config
    - ckpt=/root/autodl-tmp/pi05-runs/a3_two_cookie_adv_unfreeze_15k/checkpoints/010000/pretrained_model
    - --config
    - dims=14
    - --config
    - state_dims=16
    - --config
    - space=cartesian_delta
  startup_timeout_s: 1800
  request_timeout_s: 300
  env:
    HF_HOME: /root/autodl-tmp/hf
    HF_ENDPOINT: https://hf-mirror.com
    HF_HUB_OFFLINE: "1"

observation:
  images:
    front_view:
      source: observation.images.front
      resize: [224, 224]
    left_wrist_view:
      source: observation.images.left_wrist
      resize: [224, 224]
    right_wrist_view:
      source: observation.images.right_wrist
      resize: [224, 224]
  vectors:
    observation.state:
      source: observation.state
      slice: [0, 16]

action:
  space: cartesian_delta
  dim: 14
  chunk: 50
  clip: [-1.0, 1.0]
  execute: 50
  dt: 0.05
  normalize:
    mode: none

success:
  probe: env

evaluation:
  regime: finetuned
  primary_metric: both
  prompt_kind: free_text
