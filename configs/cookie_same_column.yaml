# Five-at-a-time bevel insertion. Uniform 2.5 mm gaps and thin left fingertips.
#
# Scene randomization: the two boxes and the arm start pose move between episodes,
# giving a policy real variation instead of one memorisable trajectory.
#
# Ranges are [low, high] offsets in metres (yaw in radians), asymmetric because the
# arm's workspace is not centred on the nominal pose.  Measured reach -- the offset
# at which the expert's own reachability check starts refusing -- with the share of
# it used here in brackets:
#
#              +x        -x        +y        -y
#   target   30 mm     140 mm    90 mm     55 mm
#   source   80 mm     170 mm   230 mm    245 mm
#
# The target box is the binding one: it can move 30 mm away from the arm but 140 mm
# towards it, so a symmetric range could only be +/-30 mm and would waste most of
# the space.  The shares below stay well inside every direction, and the source
# range is dominated instead by clearance: source and target are only 66.9 mm
# apart, and `min_box_clearance_m` rejects any draw that brings them closer than
# 20 mm -- the source box is a mocap body with infinite mass, so a collision would
# shove the target box out of the pose the expert planned for.
#
# Yaw is available on the source box as well as the target.  The batch experts find
# a row by grouping the *configured* layout on x, which a rotation does not change,
# so rows still resolve; the insertion itself is what tolerates or does not
# tolerate entering a rotated row.
physics_hz: 1000
control_hz: 20
horizon: 6000
randomization:
  source_bin_x_m: [-0.060, 0.030]
  source_bin_y_m: [-0.050, 0.050]
  source_bin_yaw_rad: 0.05
  target_bin_x_m: [-0.100, 0.020]
  target_bin_y_m: [-0.040, 0.060]
  target_bin_yaw_rad: 0.10
  arm_home_rad: 0.04
  min_box_clearance_m: 0.020
cookie_transfer:
  left_gripper_kp: 1200.0
  left_finger_pad_half_thickness_m: 0.0005
  right_gripper_kp: 2000.0
  box_lift_m: 0.0
  box_tilt_deg: 0.0
  cookie_edge_bevel_m: 0.0025
  cookie_bottom_edge_bevel_m: 0.0010
  cookie_collision_mode: compound
  cookie_friction: [0.8, 0.003, 0.0002]
  cookie_solref: [0.004, 1.0]
  cookie_solimp: [0.99, 0.999, 0.0005, 0.5, 2.0]
  source_bin_half_size_m: [0.1186, 0.1010833333]
  source_bin_wall_height_m: 0.026
  target_bin_half_size_m: [0.063, 0.035]
  target_bin_world_position_m: [0.095, 0.100, 0.753]
  target_bin_wall_height_m: 0.026
