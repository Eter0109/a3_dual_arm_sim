# The A3 scene with **LIBERO's own objects** on the table, and A3's trays shrunk away.
#
# Why
# ---
# Every policy measured in this repository has been judged on A3's own Cookie, which
# appears in no public robot-learning dataset.  A policy can fail on the Cookie because it
# cannot see it, or because it cannot drive this arm; no Cookie experiment separates the
# two.  `lerobot/pi05_libero_finetuned` was trained to pick up *the object in
# `assets/.../akita_black_bowl`* and place it on *the plate*, so putting those two objects
# on this table is the one arrangement where a failure has a meaning: whatever it does
# with a bowl it has seen ten thousand times is a statement about the arm and the
# renderer, not about object recognition.
#
# What was changed, and why the trays are gone
# --------------------------------------------
# The two Cookie trays are moved off the table rather than shrunk or removed.  Shrinking
# them is a compile error -- `_add_open_bin` derives the wall geoms from the half size, so
# a millimetre box produces a geom with a non-positive extent -- and removing them is a
# crash, because `A3CookieTransferEnv` looks its task up by body name.  Parked past the
# table's corner (x >= -0.40, y >= -0.75) they fall to the floor behind the arm, out of
# both cameras, and the table is left clear -- which is the point: a plate sitting inside
# a walled target bin reads as "put it in the bin", and the LIBERO task is "put it on the
# plate".
#
# The Cookie that remains is a single one, falling with the source tray.  It is kept
# because the environment needs at least one to build its task config; nothing in the
# scene can reach it.
#
# The props themselves are inert.  No expert touches them, no metric counts them, and
# `success` still means "the Cookie is in the target bin", which it never is.  Rollouts of
# this scene are for watching, and any number read off it should say so.
#
# Check the wiring without loading anything:
#   a3-sim inspect --config configs/libero_props.yaml

physics_hz: 500
control_hz: 20
horizon: 6000
# LIBERO's own OSC_POSE numbers, so a policy's action means here what it meant there.
# `output_max` is [0.05 m x3, 0.5 rad x3] per unit of action, and the position half is
# world-frame, which is what `CartesianDeltaAdapter` implements.
#
# The rotation half is world-frame *there* and was not here, which is the correction this
# file is now the first to ask for: `mujoco.mju_quatIntegrate` composes about the tool's own
# axes, while robosuite's `set_goal_orientation` composes `R_err @ R_current` -- about
# world-fixed ones.  The two agree only while the tool is aligned with the world, and this
# arm's tool sits at **120 degrees** from it (measured; 120.1 while holding a Cookie), so
# every rotation command was being applied about an axis 120 degrees from the intended one.
# Translation was never affected, which is why the arm could approach the bowl and could
# never orient the gripper to grasp it.
cartesian_translation_scale_m: 0.05
cartesian_rotation_scale_rad: 0.50
cartesian_rotation_frame: world
# The arm's servo cannot execute a per-step command at 20 Hz, and a LIBERO policy issues one
# every step.  Measured with `scripts/probe_tracking.py` at 10 mm per command, this arm
# delivers **56%** of what it is commanded at the default `arm_actuator_damping: 1.0` -- the
# joint servos need 150-200 ms to cover a step and the control period is 50 -- so a policy's
# plan is executed at half speed with the position lag accumulating for the whole episode.
#
# Lower damping buys the tracking back, at the cost of a transient overshoot that the default
# was chosen to avoid (`config.py` explains the ringing it was hiding):
#
#   damping    one-step response   tracking at 50 ms   overshoot
#   1.00            43%                  56%             none
#   0.50            63%                  82%             +8%
#   0.45            67%                  86%            +10%
#   0.40            70%                  95%            +12%
#
# 0.40 is the knee: the last 9 points of tracking cost 2 points of overshoot, where the
# previous 5 cost 4.  It is a config field and not a constant precisely because a scene whose
# expert was tuned for the damped response must be able to keep it -- the two-box relay turns
# it off -- so this scene-local value touches nothing else.
arm_actuator_damping: 0.40
# A 50 mm step is 1 m/s at 20 Hz, and on an arm of this reach that is about 0.1 rad/step;
# the harness default of 0.05 would clip every command and make the arm move at half the
# speed the policy planned for, which is a different experiment.
max_joint_step_rad: 0.10
# Reproduce LIBERO's own lighting and solver in this scene; `config.py` lists what that
# switches and `scripts/compare_libero_environment.py` prints the two side by side.  With
# it on, the remaining differences are the ones that cannot be removed: this arm, this
# gripper, this table's height, and this scene's contents.
libero_fidelity: true
# --- the servo, and the two knobs that are not the same knob -------------------------
#
# `arm_actuator_damping` scales the velocity gain alone, so it sets the damping *ratio*:
# it buys tracking speed by buying ringing.  Measured on the joint step response at 20 Hz
# (`scripts/probe_tracking.py`), one control step delivers:
#
#   damping   per-command tracking   overshoot past the settled value   settles in
#   1.00            55%                       0.0%                        250 ms
#   0.70            68%                       1.0%                        100 ms
#   0.40            91%                      12.2%                        300 ms
#
# 0.40 was chosen here for the tracking and the ringing was not priced -- which was a
# mistake, because a policy issuing a fresh command every 50 ms sees a position oscillating
# in a direction its own plan never asked for, and that is motion a viewer calls shaking.
#
# `arm_servo_bandwidth` scales *both* gains, so the ratio and the overshoot are untouched
# while the servo responds sooner.  At damping 0.40:
#
#   bandwidth   per-command tracking   overshoot   settles in
#   1                    91%            12.2%       300 ms
#   2                    91%             4.8%       150 ms
#   4                    90%             0.0%        50 ms
#   8                    88%             0.0%       100 ms
#
# 4 is the only point that is fast *and* still, and it is the configuration this scene
# should end up on.  It is left at the default for now on purpose: `execute` in the policy
# manifest was changed in the same sitting for a separate reason, and the two have to be
# measured one at a time or neither result means anything.
# arm_servo_bandwidth: 4.0
randomization:
  source_bin_x_m: 0.0
  source_bin_y_m: 0.0
  source_bin_yaw_rad: 0.0
  target_bin_x_m: 0.0
  target_bin_y_m: 0.0
  target_bin_yaw_rad: 0.0
  arm_home_rad: 0.0
  min_box_clearance_m: 0.020
cookie_transfer:
  left_gripper_kp: 1200.0
  left_finger_pad_half_thickness_m: 0.0005
  cookie_edge_bevel_m: 0.0025
  cookie_bottom_edge_bevel_m: 0.0010
  cookie_collision_mode: compound
  cookie_friction: [0.8, 0.003, 0.0002]
  cookie_solref: [0.004, 1.0]
  cookie_solimp: [0.99, 0.999, 0.0005, 0.5, 2.0]
  # Moved past the table's corner; see the header.  Sizes are left alone.
  source_bin_center_m: [-0.600, -1.200]
  target_bin_world_position_m: [-0.600, -1.400, 0.753]
  cookie_source_positions_m:
    - [-0.600, -1.200]
  # The LIBERO initial states this scene mirrors: its own `pruned_init` archive holds 50
  # start poses, one per episode, and LIBERO's evaluation gives episode `i` the `i`-th.
  # The arm's seven joints vary about a degree between them and the jaws are half open,
  # so a single fixed home is not the pose the policy was evaluated from.  Path is
  # relative to LIBERO's `init_states` directory.
  libero_init_states: libero_spatial/pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate.pruned_init
  libero_props:
    # LIBERO's `akita_black_bowl`: the object every `libero_spatial` task picks up.  The
    # directory holds one MJCF that names a 4.6 MB visual mesh and a 12.8 MB texture, both
    # loaded from the LIBERO cache rather than copied into this repository.
    #
    # **`position_m` is the wrapper body's origin, not the bowl's.**  LIBERO authors this
    # object with an inner body offset by `pos="0 -0.1 0"`, so the mesh and its collision
    # shapes -- and therefore the bowl a camera sees and a gripper can touch -- sit 100 mm
    # towards -y from the number below.  Measured after settling: the wrapper is at
    # (0.15, 0.23, 0.748) and the mesh at (0.15, 0.13, 0.748).  Anything that measures
    # distance to "the bowl" has to use `libero_bowl_object`, not `libero_bowl_root`.
    #
    # The layout below is LIBERO's own, taken off `libero_spatial` task 0 and reproduced
    # **relative to the bowl's measured centre** -- the only form in which it can be
    # reproduced in a scene whose robot and table are different.  Measured there, as offsets
    # from the centre of the bowl the task picks up:
    #
    #     second `akita_black_bowl`   (-125.2, +118.3) mm   172 mm away
    #     `plate`                     (+116.6,   +3.7) mm   117 mm away
    #     `glazed_rim_porcelain_ramekin` (-134.0, -12.9) mm 135 mm away
    #
    # and the task's own prompt names all three: *"pick up the black bowl between the plate
    # and the ramekin and place it on the plate"*.  This scene used to hold one bowl and one
    # plate, 200 mm apart on a bearing 88 degrees off LIBERO's -- so the policy was being
    # asked to carry 1.7x as far in a direction it had never carried, towards a plate that
    # was the only referent its instruction mentioned.  The stove and cabinet that also sit
    # in that scene are left out: they are 350 mm away, no part of the instruction, and one
    # more chance to collide with this arm.
    - name: bowl
      directory: /root/.cache/libero/assets/stable_scanned_objects/akita_black_bowl
      position_m: [0.150, 0.230, 0.780]
    # The distractor bowl.  It is not decoration: without it "the black bowl between the
    # plate and the ramekin" names the only bowl in the scene, and the phrase has nothing to
    # disambiguate.  It carries a different `name` so its bodies are prefixed differently --
    # `libero_bowl_near_object` against `libero_bowl_object` -- which is what keeps the trace
    # probe measuring the bowl the task is about.
    - name: bowl_near
      directory: /root/.cache/libero/assets/stable_scanned_objects/akita_black_bowl
      position_m: [0.025, 0.348, 0.780]
    # LIBERO's `plate`: where every `libero_spatial` task puts the bowl.  No inner offset,
    # so the wrapper is the mesh centre.
    - name: plate
      directory: /root/.cache/libero/assets/stable_scanned_objects/plate
      position_m: [0.267, 0.134, 0.775]
    - name: ramekin
      directory: /root/.cache/libero/assets/stable_scanned_objects/glazed_rim_porcelain_ramekin
      position_m: [0.016, 0.117, 0.780]
    # The last three of the scene's five objects and three fixtures, and the reason the
    # prompt can be LIBERO's own.  `libero_spatial` task 0's BDDL lists exactly:
    #
    #   objects  akita_black_bowl_1, akita_black_bowl_2, plate_1, cookies_1,
    #            glazed_rim_porcelain_ramekin_1
    #   fixtures main_table, wooden_cabinet_1, flat_stove_1
    #
    # and every position below is LIBERO's measured body position from its own compiled
    # scene under init state 0, moved through the one world offset in `collection.py`
    # (`LIBERO_WORLD_OFFSET_M`, +0.2135 / -0.0720 / -0.1500):
    #
    #   cookies_1          LIBERO ( 0.0579,  0.0264, 0.9094)  ->  ( 0.2714, -0.0456, 0.7594)
    #   wooden_cabinet_1   LIBERO ( 0.0356, -0.2776, 0.9050)  ->  ( 0.2491, -0.3496, 0.7550)
    #   flat_stove_1       LIBERO (-0.4171, -0.1311, 0.9050)  ->  (-0.2036, -0.2031, 0.7550)
    #
    # `cookies_1` is a real object the policy can see and the reference scene contains, so
    # it is dropped and settles like the rest.  The cabinet and the stove are scenery: they
    # are welded to the world with their joints dissolved and their geoms out of collision,
    # because this arm is not a Panda and its base is not where LIBERO's is -- a welded body
    # cannot be knocked over and cannot block a joint, so the only thing it can change is the
    # image, which is exactly the thing that was still missing.
    - name: cookies
      directory: /root/.cache/libero/assets/stable_hope_objects/cookies
      position_m: [0.2714, -0.0456, 0.7894]
    - name: cabinet
      directory: /root/.cache/libero/assets/articulated_objects
      xml: wooden_cabinet.xml
      position_m: [0.2491, -0.3496, 0.7550]
      static: true
    - name: stove
      directory: /root/.cache/libero/assets/articulated_objects
      xml: flat_stove.xml
      position_m: [-0.2036, -0.2031, 0.7550]
      static: true
