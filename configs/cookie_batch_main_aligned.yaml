# The second-batch scene, moved onto main's benchmark arrangement exactly.
#
# Built from `cookie_batch_second_batch.yaml` with three changes and nothing else, because the
# 20k checkpoint scores 5+ on this branch's arrangement and 0/20 on main's: the failure is a
# millimetre-scale grasp miss (`cookies_in_source` never leaves 80), so the arrangement has to
# match rather than resemble.
#
#   1. every randomisation range is zero -- the boxes, the Cookies and the arm's home pose are
#      pinned; variation comes from `collect --position-noise/--align-*` instead, so the amount is
#      recorded per run rather than baked into a file;
#   2. `target_bin_world_position_m` takes main's own height (0.74898 rather than 0.753);
#   3. the `cameras:` block is main's, wrist look-at points included.
#
# `scripts/verify_main_alignment.py` is the gate that says this file plus
# `main_alignment.apply_scene` reproduce main's three renders to 0.16/0.61/0.00 out of 255.
