# Independent two-box workflow: A is filled, pushed forward, then B slides into the same station.
physics_hz: 1000
control_hz: 20
# The fast profile *does* run the relay end to end -- measured, 2053 steps against
# this profile's 4827 -- but not yet reliably, and this config keeps the reliable
# one.  What it needs first: under the fast fill the carry leaves the box about
# 2 deg off and 2.3 mm out, which is inside the fill's own reachability
# pre-check's window (2.0 mm and 0.035 rad) by less than half a millimetre, so a
# seed can be refused at "FILL_B setup: target column 2 unreachable" before the
# fill starts.  The gap is in the carry's calibration, not in the profile; see
# `batch_profile` and the README's speed section.
arm_actuator_damping: 0.0
# The relay's push and carry controllers were measured against the slower
# baseline fill, so this scene runs the expert in that profile.
batch_expert_profile: "baseline"
horizon: 12000
# Scene randomization: all three boxes and the arm start pose move between episodes.
#
# Ranges are [low, high] offsets in metres (yaw in radians), asymmetric because the
# arm's workspace is not centred on the nominal pose.  These are measured for *this*
# scene, because reach depends on where a box sits: the working box here is at
# (0.075, 0.030), and sweeping it until the expert's own reachability check refuses
# gives, in mm,
#
#   working box   +x   6    -x 118    +y 118    -y   8      yaw +/-4.5 deg
#   spare box     +/-118 in every direction
#
# which is nothing like the single-box scene's 30/140/90/55, so copying those values
# across was wrong and produced a run that reached the second fill and then failed on
# angle error 2.07 deg against a 2.005 deg threshold.  The ranges below stay inside
# every measured limit.
#
# Two of them are narrower than reach alone would allow:
#   * the working box's +y is held to 40 mm because the relay pushes it to a fixed
#     station 90 mm away, and a box that starts most of the way there has no push
#     left to perform
#   * **the spare box's x is held to +/-4 mm**, because the carry corrects y only.
#     `RightBoxCarryController` grips the rear wall and slides the box along y; its
#     target keeps `x = initial_position[0]` and it aborts if the box drifts more
#     than 15 mm sideways, so whatever x offset the box starts with is the offset it
#     arrives with.  `VERIFY_B` then requires the box within 8 mm of the station in
#     XY, and the carry deliberately stops 4 mm short in y, so
#     `sqrt(x^2 + 4^2) < 8` leaves about 7 mm; +/-4 mm keeps a margin.  The fill
#     check allows 118 mm of x travel and the grip is reachable to +/-56 mm, but
#     neither of those is the binding limit -- measured on the first collection run,
#     before this was understood:
#
#       seed 0  x +8.5 mm   succeeded (the offset happened to survive)
#       seed 1  x +26.2 mm  CARRY_B: grip lost, one finger at 0.0 N
#       seed 2  x -25.0 mm  VERIFY_B: box arrived 27.8 mm from the station
#
#     Both rejections traced to the same uncorrected x offset.  Raising this range
#     again needs the carry to correct x, which is a change to that controller
#     rather than to this file.
#   * the spare box's yaw has to survive the carry, which grips the box and slides it
#     into place, so it arrives with the yaw it started with -- the fill's +/-4.5 deg
#     tolerance applies to that arrival, not just to the initial pose
randomization:
  source_bin_x_m: [-0.060, 0.030]
  source_bin_y_m: [-0.050, 0.050]
  source_bin_yaw_rad: 0.05
  target_bin_x_m: [-0.080, 0.004]
  target_bin_y_m: [-0.006, 0.040]
  target_bin_yaw_rad: 0.04
  spare_bin_x_m: [-0.004, 0.004]
  spare_bin_y_m: [-0.040, 0.015]
  spare_bin_yaw_rad: 0.04
  arm_home_rad: 0.04
  min_box_clearance_m: 0.025
cookie_transfer:
  left_gripper_kp: 1200.0
  left_finger_pad_half_thickness_m: 0.0005
  right_gripper_kp: 2000.0
